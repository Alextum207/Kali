<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Kali</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        padding: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
        white-space: pre-wrap;
      }
      #resultLink {
        display: block;
        margin-top: 8px;
        font-size: 13px;
      }
      #knopfAnim {
        display: none;
        width: 100%;
        margin-top: 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Kali – Dark-Pattern-Scan</h1>
    <button id="scanBtn">Scan starten</button>
    <video id="knopfAnim" src="knopfdruck.webm" muted playsinline></video>
    <div id="status"></div>
    <a id="resultLink" href="#" target="_blank" style="display: none">Ergebnis ansehen</a>
    <script src="popup.js"></script>
  </body>
</html>
